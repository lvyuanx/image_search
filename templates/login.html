<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <style>
    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 360px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 28px;
    }
    .card h1 {
      font-size: 20px;
      margin: 0 0 18px;
      text-align: center;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }
    .field input {
      width: 100%;
      height: 40px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0 10px;
      box-sizing: border-box;
      outline: none;
    }
    .btn {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 6px;
      background: #2f54eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>系统登录</h1>
    {% if error %}
    <div class="hint" style="color:#e53935;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/api/auth/login">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" placeholder="请输入账号" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码" required />
      </div>
      <button class="btn" type="submit">登录</button>
    </form>
    <div class="hint">请使用系统分配的账号密码登录</div>
  </div>
</body>
</html>
